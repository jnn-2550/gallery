<!DOCTYPE html>
<html>
<head>
  <title>My gallery display</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
      <!-- Container for our gallery -->
    <div class="container">
        <!-- Main view of our gallery -->
        <div class="main_view">
            <img src="one.jpg" id="main" alt="IMAGE">
        </div>

        <!-- All images with side view -->
        <div class="side_view">
            <img src=" /Images/one.jpg" onclick="change(this.src)">
            <img src=" /Images/two.jpg" onclick="change(this.src)">
            <img src="/Images/three.jpg" onclick="change(this.src)">
            <img src="/Images/four.jpg" onclick="change(this.src)">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
